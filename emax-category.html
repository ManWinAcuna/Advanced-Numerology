<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>html{background:#000}</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="godlike.css?v=30">
</head>
<body>
<div class="page">

  <nav class="topnav">
    <a href="stable.html" class="nav-link">🐎 Stable</a>
    <a href="profile.html" class="nav-link">My Profile</a>
    <a href="sports-betting.html" class="nav-link">Sports Betting</a>
    <a href="stocks.html" class="nav-link">Stocks</a>
    <a href="emax.html" class="nav-link active">EMAX</a>
    <a href="calculator.html" class="nav-link">Calculator</a>
    <a href="famous.html" class="nav-link">Famous Lookup</a>
    <a href="calendar.html" class="nav-link">Calendar</a>
    <a href="astrology.html" class="nav-link">Astrology</a>
    <a href="database.html" class="nav-link">Database</a>
    <a href="compatibility.html" class="nav-link">Compatibility Calculator</a>
  </nav>
  <script src="nav-scroll.js"></script>
  <script src="bottombar.js?v=8"></script>
  <script src="update-check.js?v=3"></script>

  <div class="topbar">
    <a href="emax.html" class="back-link">&larr; All Categories</a>
  </div>

  <h1 class="page-title" id="categoryTitle">Category</h1>

  <div class="db-page">

    <div class="box add-category-box" id="addEntryBox">
      <button class="box-label-row emax-collapsible-toggle" id="addEntryToggle" type="button">
        <span class="box-label" id="entryFormLabel">Add Item</span>
        <span class="emax-collapse-chevron" id="addEntryChevron">▸</span>
      </button>
      <div class="emax-collapsible-body" id="addEntryBody" hidden>
        <div class="emax-preload-btn-row">
          <input type="number" id="preloadTopCountInput" placeholder="How many" inputmode="numeric" style="display:none;">
          <button class="btn-link bulk-upload-btn" id="preloadTop50Btn" type="button" style="display:none;">⚡ Preload</button>
          <button class="btn-link bulk-upload-btn" id="syncSeedDataBtn" type="button" style="display:none;">🔄 Sync from Seed Data</button>
          <button class="btn-link bulk-upload-btn" id="bulkUploadBtn" type="button">📤 Bulk Upload</button>
          <button class="btn-link bulk-upload-btn" id="findPicturesBtn" type="button">🖼️ Find Missing Pictures</button>
        </div>
        <div class="inline-form">
          <input type="text" id="newEntryName" placeholder="Name">
          <input type="text" id="newEntryDate" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10" autocomplete="off">
          <button class="icon-btn icon-btn-lookup" id="entryLookupBtn" type="button" title="Look up date">🔍</button>
          <input type="text" id="newEntryImage" placeholder="Image URL (optional)">
          <label class="emax-year-only-toggle"><input type="checkbox" id="newEntryNoImage"> No photo</label>
          <button id="addEntryBtn" class="btn">Add</button>
          <button id="cancelEditBtn" class="btn-link" style="display:none;">Cancel</button>
        </div>
        <div class="inline-form" id="newEntryArtistRow" style="display:none;">
          <input type="text" id="newEntryArtist" placeholder="Artist (optional) - auto-filled by Look Up, or type your own">
          <input type="text" id="newEntryArtistDate" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10" autocomplete="off" style="display:none;">
        </div>
        <div class="inline-form" id="newEntrySeverityRow" style="display:none;">
          <span class="emax-filter-label" id="newEntrySeverityLabel">Severity</span>
          <input type="number" id="newEntrySeverityNumeric" placeholder="" style="display:none;">
          <span class="emax-severity-picker" id="newEntrySeverityScale" style="display:none;">
            <button class="emax-severity-btn" data-value="1" type="button">1</button>
            <button class="emax-severity-btn" data-value="2" type="button">2</button>
            <button class="emax-severity-btn" data-value="3" type="button">3</button>
            <button class="emax-severity-btn" data-value="4" type="button">4</button>
            <button class="emax-severity-btn" data-value="5" type="button">5</button>
          </span>
        </div>
        <div class="inline-form" id="preloadByYearRow" style="display:none;">
          <input type="number" id="preloadYearInput" placeholder="Year" inputmode="numeric">
          <input type="number" id="preloadYearCountInput" placeholder="How many" inputmode="numeric" value="200" min="1" max="1000">
          <button id="preloadByYearBtn" class="btn" type="button">Preload by Year</button>
        </div>
        <div class="famous-status" id="entryLookupStatus"></div>
      </div>
    </div>

    <div class="box" id="emaxDistributionBox">
      <button class="box-label-row emax-collapsible-toggle" id="emaxDistributionToggle" type="button">
        <span class="box-label" id="emaxDistributionLabel">Distribution</span>
        <span class="emax-collapse-chevron" id="emaxDistributionChevron">▸</span>
      </button>
      <div class="emax-collapsible-body" id="emaxDistributionBody" hidden>
        <div class="emax-toggle-group emax-dist-dimension-toggle" id="emaxDistDimensionToggle">
          <button type="button" data-value="lifePath" class="active">Life Path</button>
          <button type="button" data-value="lifePathCompound">Life Path Compound</button>
          <button type="button" data-value="reducedDay">Reduced Day</button>
          <button type="button" data-value="rawDay">Day of Month</button>
          <button type="button" data-value="chineseZodiac">Chinese Zodiac</button>
          <button type="button" data-value="westernZodiac">Western Zodiac</button>
        </div>
        <div id="emaxDistributionChart"></div>
        <button class="btn-link" id="emaxDistributionClearBtn" type="button" style="display:none;">Clear bar filter</button>
      </div>
    </div>

    <div class="inline-form emax-search-row">
      <input type="text" id="emaxSearchInput" placeholder="Search by name or artist...">
      <button class="emax-filters-toggle-btn" id="emaxFiltersToggleBtn" type="button">
        <span class="emax-filters-toggle-dot"></span>Filters
      </button>
    </div>

    <div class="emax-filter-drawer" id="emaxFilterDrawer">
      <div class="emax-filter-drawer-inner">
        <div class="emax-filter-block">
          <span class="emax-filter-label">Score</span>
          <div class="emax-toggle-group" id="emaxScoreModeToggle">
            <button type="button" data-value="over" class="active">Over</button>
            <button type="button" data-value="under">Under</button>
          </div>
          <input type="number" id="emaxFilterValue" placeholder="e.g. 80" min="0" max="100">
        </div>

        <div class="emax-filter-block" id="emaxSeverityFilterBlock" style="display:none;">
          <span class="emax-filter-label" id="emaxSeverityFilterLabel">Severity</span>
          <div class="emax-toggle-group" id="emaxSeverityNumericModeToggle" style="display:none;">
            <button type="button" data-value="over" class="active">Over</button>
            <button type="button" data-value="under">Under</button>
          </div>
          <input type="number" id="emaxSeverityFilterValue" placeholder="" style="display:none;">
          <div class="emax-toggle-group" id="emaxSeverityScaleModeToggle" style="display:none;">
            <button type="button" data-value="atLeast" class="active">At least</button>
            <button type="button" data-value="exactly">Exactly</button>
          </div>
          <span class="emax-severity-picker" id="emaxSeverityFilterPicker" style="display:none;">
            <button class="emax-severity-btn" data-value="1" type="button">1</button>
            <button class="emax-severity-btn" data-value="2" type="button">2</button>
            <button class="emax-severity-btn" data-value="3" type="button">3</button>
            <button class="emax-severity-btn" data-value="4" type="button">4</button>
            <button class="emax-severity-btn" data-value="5" type="button">5</button>
          </span>
        </div>

        <div class="emax-filter-block">
          <span class="emax-filter-label">Stars</span>
          <div class="emax-toggle-group" id="emaxStarModeToggle">
            <button type="button" data-value="atLeast" class="active">At least</button>
            <button type="button" data-value="exactly">Exactly</button>
          </div>
          <span class="emax-stars emax-star-filter" id="emaxStarFilterPicker">
            <button class="emax-star" data-star="1" type="button" title="1 star">&#9733;</button>
            <button class="emax-star" data-star="2" type="button" title="2 stars">&#9733;</button>
            <button class="emax-star" data-star="3" type="button" title="3 stars">&#9733;</button>
            <button class="emax-star" data-star="4" type="button" title="4 stars">&#9733;</button>
            <button class="emax-star" data-star="5" type="button" title="5 stars">&#9733;</button>
          </span>
          <button class="emax-unrated-btn" id="emaxUnratedFilterBtn" type="button">Unrated only</button>
        </div>

        <div class="emax-filter-block">
          <span class="emax-filter-label">Picture</span>
          <div class="emax-toggle-group" id="emaxPictureToggle">
            <button type="button" data-value="any" class="active">Any</button>
            <button type="button" data-value="has">Has</button>
            <button type="button" data-value="none">None</button>
          </div>
        </div>

        <div class="emax-filter-block emax-filter-clear-row">
          <button class="btn-link" id="emaxFilterClearBtn" type="button" style="display:none;">Clear filters</button>
        </div>
      </div>
    </div>

    <div id="entriesContainer" class="emax-tile-grid"></div>

    <div id="emaxPagination"></div>

  </div>


</div>

<!-- Deliberately OUTSIDE .page - scroll-viewport.js wraps only body > .page
     into the app's real scrolling container; a position:fixed popup left
     nested inside it can visually lag behind or half-follow the
     background's own scroll on iOS Safari (see category.html). Relative
     DOM order among these three is load-bearing - see each one's own
     comment below for why. -->
<div class="modal-overlay" id="itemModalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="itemModalClose" title="Close">&times;</button>
    <div id="itemModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="emaxTimelineOverlay">
  <div class="modal-box modal-box-narrow">
    <button class="modal-close" id="emaxTimelineClose" title="Close">&times;</button>
    <div id="emaxTimelineBody"></div>
  </div>
</div>

<!-- Single-year detail mini-popup (emax-popup.js) - tapping a Timeline
     chip opens its note here, stacked on top of the Timeline modal
     (later in the DOM = higher z-index, same convention as the Audit
     detail popup opening the item popup on top of itself), instead of
     expanding inline and needing a scroll to reach it. -->
<div class="modal-overlay" id="emaxYearDetailOverlay">
  <div class="modal-box modal-box-narrow">
    <button class="modal-close" id="emaxYearDetailClose" title="Close">&times;</button>
    <div id="emaxYearDetailBody"></div>
  </div>
</div>

<script src="scroll-viewport.js"></script>
<script src="astronomy.browser.min.js"></script>
<script src="astro-engine.js"></script>
<script src="numerology.js"></script>
<script src="compat-data.js"></script>
<script src="compat-engine.js"></script>
<script src="big-store.js"></script>
<script src="db-core.js?v=2"></script>
<script src="firebase-loader.js"></script>
<script src="compat-render.js?v=2"></script>
<script src="bulk-upload.js"></script>
<script src="emax-seed-data.js?v=3"></script>
<script src="emax-popup.js"></script>
<script src="emax-category.js"></script>
<script src="godlike.js?v=2"></script>
</body>
</html>
