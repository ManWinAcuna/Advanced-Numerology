<div class="page">

  <nav class="topnav">

  </nav>
  <script src="nav-scroll.js"></script>

  <div class="topbar">
    <a href="emax.html" class="back-link">&larr; All Categories</a>
  </div>

  <h1 class="page-title" id="categoryTitle">Category</h1>

  <div class="db-page">

    <div class="box add-category-box" id="addEntryBox">
      <div class="box-label-row">
        <div class="box-label" id="entryFormLabel">Add Item</div>
        <button class="btn-link bulk-upload-btn" id="preloadTop50Btn" type="button" style="display:none;">⚡ Preload Top 50</button>
        <button class="btn-link bulk-upload-btn" id="bulkUploadBtn" type="button">📤 Bulk Upload</button>
      </div>
      <div class="inline-form">
        <input type="text" id="newEntryName" placeholder="Name">
        <input type="text" id="newEntryDate" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10" autocomplete="off">
        <button class="icon-btn icon-btn-lookup" id="entryLookupBtn" type="button" title="Look up date">🔍</button>
        <input type="text" id="newEntryImage" placeholder="Image URL (optional)">
        <button id="addEntryBtn" class="btn">Add</button>
        <button id="cancelEditBtn" class="btn-link" style="display:none;">Cancel</button>
      </div>
      <div class="famous-status" id="entryLookupStatus"></div>
    </div>

    <div id="entriesContainer" class="entries-list emax-entries-list"></div>

  </div>

  <div class="modal-overlay" id="itemModalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="itemModalClose" title="Close">&times;</button>
      <div id="itemModalBody"></div>
    </div>
  </div>

</div>

<script src="astronomy.browser.min.js"></script>
