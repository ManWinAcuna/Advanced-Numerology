<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Category - EMAX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <nav class="topnav">
    <a href="profile.html" class="nav-link">My Profile</a>
    <a href="sports-betting.html" class="nav-link">Sports Betting</a>
    <a href="stocks.html" class="nav-link">Stocks</a>
    <a href="emax.html" class="nav-link active">EMAX</a>
    <a href="calculator.html" class="nav-link">Calculator</a>
    <a href="famous.html" class="nav-link">Famous Lookup</a>
    <a href="calendar.html" class="nav-link">Calendar</a>
    <a href="astrology.html" class="nav-link">Astrology</a>
    <a href="database.html" class="nav-link">Database</a>
    <a href="compatibility.html" class="nav-link">Compatibility Calculator</a>
  </nav>
  <script src="nav-scroll.js"></script>

  <div class="topbar">
    <a href="emax.html" class="back-link">&larr; All Categories</a>
  </div>

  <h1 class="page-title" id="categoryTitle">Category</h1>

  <div class="db-page">

    <div class="box add-category-box" id="addEntryBox">
      <button class="box-label-row emax-collapsible-toggle" id="addEntryToggle" type="button">
        <span class="box-label" id="entryFormLabel">Add Item</span>
        <span class="emax-collapse-chevron" id="addEntryChevron">▸</span>
      </button>
      <div class="emax-collapsible-body" id="addEntryBody" hidden>
        <div class="emax-preload-btn-row">
          <button class="btn-link bulk-upload-btn" id="preloadTop50Btn" type="button" style="display:none;">⚡ Preload Top</button>
          <button class="btn-link bulk-upload-btn" id="bulkUploadBtn" type="button">📤 Bulk Upload</button>
        </div>
        <div class="inline-form">
          <input type="text" id="newEntryName" placeholder="Name">
          <input type="text" id="newEntryDate" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10" autocomplete="off">
          <button class="icon-btn icon-btn-lookup" id="entryLookupBtn" type="button" title="Look up date">🔍</button>
          <input type="text" id="newEntryImage" placeholder="Image URL (optional)">
          <label class="emax-year-only-toggle"><input type="checkbox" id="newEntryNoImage"> No photo</label>
          <button id="addEntryBtn" class="btn">Add</button>
          <button id="cancelEditBtn" class="btn-link" style="display:none;">Cancel</button>
        </div>
        <div class="inline-form" id="newEntryArtistRow" style="display:none;">
          <input type="text" id="newEntryArtist" placeholder="Artist (optional) - auto-filled by Look Up, or type your own">
        </div>
        <div class="inline-form" id="preloadByYearRow" style="display:none;">
          <input type="number" id="preloadYearInput" placeholder="Year" inputmode="numeric">
          <input type="number" id="preloadYearCountInput" placeholder="How many" inputmode="numeric" value="200" min="1" max="1000">
          <button id="preloadByYearBtn" class="btn" type="button">Preload by Year</button>
        </div>
        <div class="famous-status" id="entryLookupStatus"></div>
      </div>
    </div>

    <div class="inline-form emax-search-row">
      <input type="text" id="emaxSearchInput" placeholder="Search by name or artist...">
    </div>

    <div class="inline-form emax-filter-row" id="emaxFilterRow">
      <label class="emax-filter-label" for="emaxFilterValue">Score</label>
      <select id="emaxFilterMode">
        <option value="over">Over</option>
        <option value="under">Under</option>
      </select>
      <input type="number" id="emaxFilterValue" placeholder="e.g. 80" min="0" max="100">

      <label class="emax-filter-label" for="emaxStarFilterMode">Stars</label>
      <select id="emaxStarFilterMode">
        <option value="atLeast">At least</option>
        <option value="exactly">Exactly</option>
      </select>
      <span class="emax-stars emax-star-filter" id="emaxStarFilterPicker">
        <button class="emax-star" data-star="1" type="button" title="1 star">&#9733;</button>
        <button class="emax-star" data-star="2" type="button" title="2 stars">&#9733;</button>
        <button class="emax-star" data-star="3" type="button" title="3 stars">&#9733;</button>
        <button class="emax-star" data-star="4" type="button" title="4 stars">&#9733;</button>
        <button class="emax-star" data-star="5" type="button" title="5 stars">&#9733;</button>
      </span>

      <label class="emax-filter-label" for="emaxPictureFilter">Picture</label>
      <select id="emaxPictureFilter">
        <option value="any">Any</option>
        <option value="has">Has picture</option>
        <option value="none">No picture</option>
      </select>

      <button class="btn-link" id="emaxFilterClearBtn" type="button" style="display:none;">Clear filters</button>
    </div>

    <div id="entriesContainer" class="entries-list emax-entries-list"></div>

  </div>

  <div class="modal-overlay" id="itemModalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="itemModalClose" title="Close">&times;</button>
      <div id="itemModalBody"></div>
    </div>
  </div>

</div>

<script src="astronomy.browser.min.js"></script>
<script src="astro-engine.js"></script>
<script src="numerology.js"></script>
<script src="compat-data.js"></script>
<script src="compat-engine.js"></script>
<script src="big-store.js"></script>
<script src="db-core.js"></script>
<script src="firebase-loader.js"></script>
<script src="compat-render.js"></script>
<script src="bulk-upload.js"></script>
<script src="emax-seed-data.js"></script>
<script src="emax-category.js"></script>
</body>
</html>
