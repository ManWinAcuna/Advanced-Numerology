<style>
  /* Versus (Boost13 2026-08-14): one today-rectangle up top, two compact
     panels side by side underneath - ALWAYS side by side, phone included. */
  .vs-today { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center;
    padding: 12px 10px; }
  .vs-tstat { text-align: center; min-width: 52px; }
  .vs-tstat b { display: block; font-size: 19px; color: var(--gold, #f5c542); }
  .vs-tstat span { font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); }
  .vs-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .vs-input-col { display: flex; flex-direction: column; gap: 6px; }
  .vs-input-col input[type="text"] { width: 100%; }
  .vs-input-col input, .vs-input-col select { font-size: 12.5px; }
  .vs-band { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; margin: 4px 0 10px; }
  .vs-score { text-align: center; font-size: 17px; font-weight: 700; padding: 7px 4px;
    border: 1px solid var(--border); border-radius: 12px; color: var(--muted); }
  .vs-score.good { color: var(--good, #8bc34a); border-color: var(--good, #8bc34a); }
  .vs-score.mid { color: var(--gold, #f5c542); border-color: var(--gold, #f5c542); }
  .vs-score.bad { color: var(--bad, #e5393f); border-color: var(--bad, #e5393f); }
  .vs-score.lead { box-shadow: 0 0 14px rgba(245, 197, 66, .35); }
  .vs-score span { display: block; font-size: 9px; font-weight: 400; letter-spacing: .08em;
    text-transform: uppercase; }
  .vs-shield { text-align: center; border: 1px solid var(--border); border-radius: 50%;
    width: 62px; height: 62px; display: flex; flex-direction: column; justify-content: center;
    font-size: 16px; font-weight: 700; }
  .vs-shield span { font-size: 8.5px; font-weight: 400; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); }
  .vs-shield.good { color: var(--good, #8bc34a); border-color: var(--good, #8bc34a); }
  .vs-shield.mid { color: var(--gold, #f5c542); border-color: var(--gold, #f5c542); }
  .vs-shield.bad { color: var(--bad, #e5393f); border-color: var(--bad, #e5393f); }
  .vs-grid { width: 100%; border-collapse: collapse; }
  .vs-grid td { padding: 6px 4px; border-top: 1px solid var(--border); font-size: 12.5px;
    text-align: center; color: var(--text); width: 40%; }
  .vs-grid td.vs-label { width: 20%; font-size: 10px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted); }
  .vs-grid td .vs-sub { display: block; font-size: 9.5px; color: var(--muted); }
  .vs-grid td.win { color: var(--good, #8bc34a); font-weight: 700;
    background: rgba(139, 195, 74, .07); }
  .vs-names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 2px; }
  .vs-names .vs-name { text-align: center; font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vs-empty { text-align: center; color: var(--muted); font-size: 12.5px; padding: 18px 8px; }
</style>
</head>
