<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  /* Versus (Boost13 2026-08-14; day picker + visual pass 2026-08-22):
     one day instrument up top (steppable, tappable, defaults to today),
     two compact panels side by side underneath - ALWAYS side by side,
     phone included. Side identities: A = brand gold, B = cold steel. */
  :root { --vsA: var(--gold, #f5c542); --vsB: #9fb9de; }

  /* ---- day instrument ---- */
  .vs-daypanel { position: relative; overflow: hidden; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 10px 10px 13px;
    margin-bottom: 12px; }
  .vs-daypanel::before { content: ''; position: absolute; left: 15%; right: 15%;
    top: -55px; height: 110px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, var(--acc-ghost), transparent 70%); }
  .vs-dayhead { display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: 8px; position: relative; z-index: 1; }
  .vs-step { width: 38px; height: 38px; background: none; border: 1px solid var(--border);
    border-radius: 11px; color: var(--muted); font-size: 20px; line-height: 1;
    cursor: pointer; -webkit-tap-highlight-color: transparent; padding: 0 0 2px; }
  .vs-step:active { color: var(--acc-text); border-color: var(--acc-dim); }
  .vs-daycenter { display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 0; }
  .vs-daydate { position: relative; font-family: var(--gk-display); font-weight: 600;
    font-size: 15.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--text); text-align: center; cursor: pointer; white-space: nowrap; }
  .vs-daydate input { position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; margin: 0; cursor: pointer; }
  .vs-dayreset { font-family: var(--gk-ui); font-size: 8.5px; font-weight: 600;
    letter-spacing: .24em; text-transform: uppercase; border-radius: 999px;
    padding: 3px 11px 3px 13px; background: none; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .vs-dayreset.is-today { color: var(--gold); border-color: rgba(245, 197, 66, .38);
    background: rgba(245, 197, 66, .07); cursor: default; }

  .vs-today { display: flex; flex-wrap: wrap; gap: 9px 18px; justify-content: center;
    padding: 12px 2px 0; position: relative; z-index: 1; }
  .vs-tstat { text-align: center; min-width: 52px; }
  .vs-tstat b { display: block; font-family: var(--gk-display); font-weight: 700;
    font-size: 20px; line-height: 1.15; color: var(--acc-text);
    filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .9))
            drop-shadow(0 0 12px color-mix(in srgb, var(--acc) 26%, transparent)); }
  .vs-tstat.an b { font-size: 13.5px; padding-top: 4px; }
  .vs-tstat span { display: block; margin-top: 2px; font-family: var(--gk-ui);
    font-size: 8.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); }

  /* ---- fighters ---- */
  .vs-setup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px;
    align-items: stretch; margin-bottom: 12px; }
  .vs-fighter { position: relative; overflow: hidden; background: var(--panel);
    border: 1px solid var(--border); border-radius: 13px; padding: 12px 10px 10px;
    display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .vs-fighter::before { content: ''; position: absolute; top: 0; left: 14%; right: 14%;
    height: 2px; border-radius: 2px; }
  .vs-fighter.a::before { background: linear-gradient(90deg, transparent, var(--vsA), transparent); }
  .vs-fighter.b::before { background: linear-gradient(90deg, transparent, var(--vsB), transparent); }
  .vs-corner { position: absolute; right: 6px; bottom: -8px; font-family: var(--gk-display);
    font-weight: 700; font-size: 52px; line-height: 1; pointer-events: none; opacity: .09; }
  .vs-fighter.a .vs-corner { color: var(--vsA); }
  .vs-fighter.b .vs-corner { color: var(--vsB); }
  .vs-fighter input, .vs-fighter select { width: 100%; box-sizing: border-box; min-width: 0;
    background: rgba(255, 255, 255, .045); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); padding: 7px 9px; font-size: 16px;
    font-family: var(--gk-ui); color-scheme: dark; outline: none; position: relative; }
  .vs-fighter input::placeholder { color: var(--muted); }
  .vs-fighter.a :is(input, select):focus { border-color: color-mix(in srgb, var(--vsA) 55%, transparent); }
  .vs-fighter.b :is(input, select):focus { border-color: color-mix(in srgb, var(--vsB) 55%, transparent); }
  .vs-fighter select { font-size: 13px; color: var(--muted); }
  .vs-mark { display: flex; align-items: center; justify-content: center;
    font-family: var(--gk-display); font-weight: 600; font-size: 12px;
    letter-spacing: .2em; color: var(--muted); padding: 0 1px; }

  /* ---- verdict band ---- */
  .vs-band { display: grid; grid-template-columns: 1fr auto 1fr; gap: 9px;
    align-items: stretch; margin: 14px 0 9px; }
  .vs-score { display: flex; flex-direction: column; justify-content: center; gap: 2px;
    text-align: center; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 8px 11px; min-width: 0; color: var(--muted); }
  .vs-score-name { font-family: var(--gk-ui); font-size: 9.5px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vs-score b { font-family: var(--gk-display); font-weight: 700; font-size: 31px;
    line-height: 1.08;
    background: linear-gradient(168deg,
      color-mix(in srgb, currentColor 92%, #fff 8%) 12%,
      color-mix(in srgb, currentColor 70%, #000 12%) 48%,
      color-mix(in srgb, currentColor 96%, #fff 14%) 86%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .9))
            drop-shadow(0 0 14px color-mix(in srgb, currentColor 30%, transparent)); }
  .vs-score .sub { font-family: var(--gk-ui); font-size: 8.5px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .vs-score.good { color: var(--good, #8bc34a); border-color: rgba(139, 195, 74, .35); }
  .vs-score.mid { color: var(--gold, #f5c542); border-color: rgba(245, 197, 66, .35); }
  .vs-score.bad { color: var(--bad, #e5393f); border-color: rgba(229, 57, 63, .35); }
  .vs-score.lead { box-shadow: 0 0 18px color-mix(in srgb, currentColor 22%, transparent),
    inset 0 0 0 1px color-mix(in srgb, currentColor 22%, transparent); }
  .vs-shield { align-self: center; width: 72px; height: 72px; border-radius: 50%;
    display: flex; flex-direction: column; justify-content: center; text-align: center;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
  .vs-shield b { font-family: var(--gk-display); font-weight: 700; font-size: 17px;
    line-height: 1.1; color: currentColor; }
  .vs-shield span { font-family: var(--gk-ui); font-size: 7.5px; font-weight: 600;
    letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-top: 1px; }
  .vs-shield.good { color: var(--good, #8bc34a); border-color: rgba(139, 195, 74, .45); }
  .vs-shield.mid { color: var(--gold, #f5c542); border-color: rgba(245, 197, 66, .45); }
  .vs-shield.bad { color: var(--bad, #e5393f); border-color: rgba(229, 57, 63, .45); }

  .vs-edge { display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 10px; font-family: var(--gk-ui); font-size: 8.5px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .vs-edge i { width: 7px; height: 7px; border-radius: 50%; }
  .vs-edge i.a { background: var(--vsA); box-shadow: 0 0 7px var(--vsA); }
  .vs-edge i.b { background: var(--vsB); box-shadow: 0 0 7px var(--vsB); }
  .vs-edge .cnt { font-family: var(--gk-display); font-weight: 700; font-size: 13.5px;
    color: var(--text); letter-spacing: 0; }

  /* ---- the duel grid ---- */
  .vs-gridcard { background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 3px 9px 5px; margin-bottom: 12px; }
  .vs-grid { width: 100%; border-collapse: collapse; }
  .vs-grid td { padding: 7px 4px; border-top: 1px solid var(--border); text-align: center;
    vertical-align: middle; }
  .vs-grid tr:first-child td { border-top: none; }
  .vs-grid td.side { width: 37%; font-family: var(--gk-display); }
  .vs-grid td.side b { font-weight: 700; font-size: 14.5px; color: var(--text); }
  .vs-rs { display: block; margin-top: 1px; font-family: var(--gk-ui); font-size: 9px;
    font-weight: 700; letter-spacing: .04em; color: var(--muted); }
  .vs-rs.good { color: var(--good, #8bc34a); }
  .vs-rs.mid { color: var(--gold, #f5c542); }
  .vs-rs.bad { color: var(--bad, #e5393f); }
  .vs-rs.none { color: var(--muted); }
  .vs-grid td.side.win b { color: var(--good, #8bc34a); }
  .vs-grid td.side.a.win { background: linear-gradient(90deg, rgba(139, 195, 74, .09), transparent);
    box-shadow: inset 3px 0 0 rgba(139, 195, 74, .55); }
  .vs-grid td.side.b.win { background: linear-gradient(270deg, rgba(139, 195, 74, .09), transparent);
    box-shadow: inset -3px 0 0 rgba(139, 195, 74, .55); }
  .vs-spine { width: 26%; }
  .vs-spine .l { display: block; font-family: var(--gk-ui); font-size: 8.5px;
    font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); }
  .vs-spine b { display: block; margin-top: 1px; font-family: var(--gk-display);
    font-weight: 600; font-size: 12px; color: var(--acc-text); }

  .vs-empty { text-align: center; color: var(--muted); font-size: 12.5px;
    padding: 20px 8px; font-style: italic; }

  @media (max-width: 380px) {
    .vs-today { gap: 8px 12px; }
    .vs-tstat { min-width: 46px; }
    .vs-tstat b { font-size: 18px; }
    .vs-score b { font-size: 27px; }
  }
</style>
