  <div class="db-page">

    <div class="box add-category-box" id="addEntryBox">
      <div class="box-label-row">
        <div class="box-label" id="entryFormLabel">Add Birthday</div>
        <button class="btn-link bulk-upload-btn" id="bulkUploadBtn" type="button">📤 Bulk Upload</button>
      </div>
      <div class="inline-form">
        <input type="text" id="newEntryName" placeholder="Name">
        <input type="text" id="newEntryDate" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10" autocomplete="off">
        <input type="time" id="newEntryTime" title="Birth time (optional)">
        <button id="addEntryBtn" class="btn">Add</button>

      </div>
    </div>

    <div id="entriesContainer" class="entries-list"></div>

  </div>

</div>

<!-- Deliberately OUTSIDE .page: scroll-viewport.js wraps only body > .page
     into the app's real (position:fixed + overflow:auto) scrolling
     container, exactly so fixed-position overlays never end up nested
     inside a scrolling ancestor - iOS Safari's compositor doesn't keep a
     position:fixed descendant properly detached from an overflow:auto
     parent's own scroll/momentum, so a tall enough popup nested in there
     (this one, easily) could visually lag behind or half-follow the
     background scrolling underneath it. bottombar.js's fixed frame and
     the auth widget already live out here for the same reason - see its
     header comment. -->
<div class="modal-overlay" id="entryModalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="entryModalClose" title="Close">&times;</button>
    <div id="entryModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="compareMiniOverlay" style="z-index:700">
  <div class="modal-box modal-box-narrow">
    <button class="modal-close" id="compareMiniClose" title="Close">&times;</button>
    <div id="compareMiniBody"></div>
  </div>
</div>

<!-- General Reading + identity popups (2026-08-08) - same modal markup as
     profile.html, needed by renderCompoundStories() in compat-render.js.
     Stacks above entryModalOverlay (a story link is tapped from inside the
     entry detail popup), same z-index tier as compareMiniOverlay above. -->
<div class="modal-overlay" id="storyModalOverlay" style="z-index:700">
  <div class="modal-box modal-box-narrow">
    <button class="modal-close" id="storyModalClose" title="Close">&times;</button>
    <div id="storyModalBody"></div>
  </div>
</div>
