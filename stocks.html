<div class="page">

  <nav class="topnav">
    <a href="stable.html" class="nav-link">🐎 Stable</a>
    <a href="profile.html" class="nav-link">My Profile</a>
    <a href="sports-betting.html" class="nav-link">Sports Betting</a>

    <a href="emax.html" class="nav-link">EMAX</a>

  </nav>
  <script src="nav-scroll.js"></script>
  <script src="bottombar.js?v=8"></script>
  <script src="update-check.js?v=4"></script>

  <div class="stocks-header">
    <div class="stocks-title">Stock Cycles</div>
    <div class="stocks-year-chip" id="stocksYearChip"></div>
  </div>
  <div class="stocks-filterbar">
    <div class="stocks-filter-seg" id="stocksDirFilter">
      <button class="stocks-filter-btn active" data-dir="all">All</button>
      <button class="stocks-filter-btn" data-dir="long">Longs</button>
      <button class="stocks-filter-btn" data-dir="short">Shorts</button>
    </div>
    <div class="stocks-filter-seg" id="stocksLevelFilter">
      <button class="stocks-filter-btn active" data-level="year">Year</button>
      <button class="stocks-filter-btn" data-level="month">Month</button>
      <button class="stocks-filter-btn" data-level="day">Day</button>
    </div>
  </div>
  <div class="stocks-cycles-shortcut">
    <span>Day Cycles backtest</span>
    <button class="stock-trades-btn" id="stocksCyclesEsBtn">ES</button>
    <button class="stock-trades-btn" id="stocksCyclesNqBtn">NQ</button>
  </div>

  <div class="stock-dashboard">
    <div class="stock-dashboard-box">
      <div class="stock-section-label">Radar &middot; Next Opportunities</div>
      <div id="stocksRadar"></div>
    </div>
    <div class="stock-dashboard-box">
      <div id="stocksCombinedRecord"></div>
    </div>
  </div>

  <div class="stock-dashboard-box" style="margin-bottom:18px;">
    <div id="stocksTransitBacktest"></div>
  </div>

  <div id="stocksGrid"></div>

  <div class="stocks-footnote">Watchlist lens only &mdash; no tracked record behind these reads yet.</div>

  <div class="stock-modal-overlay" id="stockModalOverlay">
    <div class="stock-modal">
      <button class="stock-modal-close" id="stockModalClose">&times;</button>
      <div id="stockModalBody"></div>
    </div>
  </div>

</div>

<script src="scroll-viewport.js"></script>
<script src="astronomy.browser.min.js"></script>
